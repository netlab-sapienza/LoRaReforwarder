version: '3.8'
services:
  mariadb:
    image: mariadb:latest
    restart: always
    ports:
      - 3306:3306
    command: --init-file /data/init.sql
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./init.sql:/data/init.sql
    environment:
      MYSQL_ROOT_PASSWORD: 2BAS3PaZQ6BBySwv
    networks:
      database_network:
        ipv4_address: 192.168.135.2

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - 8089:80
    environment:
      - PMA_HOST=mariadb
    networks:
      database_network:
        ipv4_address: 192.168.135.4
    depends_on:
      - mariadb
    
  lorareforwarder:
    ports:
      - '1700:1700/udp'
    networks:
      database_network:
        ipv4_address: 192.168.135.3
    restart: always
    volumes:
      - /opt/lorareforwarderBackups:/lorareforwarder/backups
    depends_on:
      - mariadb
    image: 'netlab-sapienza/lorareforwarder:latest'

volumes:
  mariadb-data:

networks:
  database_network:
    driver: bridge
    ipam:
     config:
       - subnet: 192.168.135.0/24
         gateway: 192.168.135.1